<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Te amo 🧸🤎</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #211813;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .contenedor {
            width: 90%;
            max-width: 500px;
            text-align: center;
            color: white;
            padding: 25px;
        }
        .foto {
            width: 100%;
            max-height: 65vh;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.45);
            margin-bottom: 25px;
        }
        h1 {
            font-size: 32px;
            margin: 10px 0;
            color: #f1d6c2;
        }
        p {
            font-size: 20px;
            color: #eee;
            margin-top: 10px;
        }
        .corazones {
            font-size: 28px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <img src="COLLAJE.jpeg" alt="Nuestro collage" class="foto">
        <h1>Te amo, babosa 🧸🤎</h1>
        <p>
            Aunque a veces no sepa cómo decirlo,
            quería que supieras que todavía te llevo conmigo.
        </p>
        <div class="corazones">
            🧸🤎🫶🏻
        </div>
    </div>
</body>
</html>
