<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Para ti 🧸🤎</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #3a2923 0%, #160f0d 70%);
      font-family: Arial, sans-serif;
      color: white;
    }

    .contenedor {
      text-align: center;
      position: relative;
      z-index: 2;
      padding: 30px;
      animation: aparecer 2s ease forwards;
    }

    .oso {
      font-size: 65px;
      display: block;
      animation: flotar 2.5s ease-in-out infinite;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0;
      font-size: clamp(45px, 13vw, 85px);
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow:
        0 0 10px rgba(255,255,255,0.35),
        0 0 25px rgba(190,130,100,0.6);
      animation: latido 1.8s ease-in-out infinite;
    }

    .corazon-central {
      font-size: 38px;
      margin-top: 18px;
      animation: latido 1.2s ease-in-out infinite;
    }

    .frase {
      margin-top: 18px;
      font-size: 17px;
      opacity: 0.75;
      letter-spacing: 1px;
    }

    .corazon {
      position: absolute;
      bottom: -50px;
      font-size: 25px;
      opacity: 0;
      animation: subir linear infinite;
      pointer-events: none;
    }

    .c1 { left: 8%;  animation-duration: 8s;  animation-delay: 1s; }
    .c2 { left: 20%; animation-duration: 11s; animation-delay: 3s; font-size: 18px; }
    .c3 { left: 35%; animation-duration: 9s;  animation-delay: 0s; font-size: 30px; }
    .c4 { left: 52%; animation-duration: 12s; animation-delay: 4s; font-size: 20px; }
    .c5 { left: 68%; animation-duration: 9s;  animation-delay: 2s; font-size: 32px; }
    .c6 { left: 82%; animation-duration: 10s; animation-delay: 5s; font-size: 22px; }
    .c7 { left: 92%; animation-duration: 13s; animation-delay: 1s; font-size: 17px; }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(25px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes latido {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }
    }

    @keyframes flotar {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes subir {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      15% {
        opacity: 0.8;
      }

      80% {
        opacity: 0.7;
      }

      100% {
        transform: translateY(-110vh) rotate(25deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <!-- Corazones flotando -->
  <div class="corazon c1">🤎</div>
  <div class="corazon c2">♡</div>
  <div class="corazon c3">🤎</div>
  <div class="corazon c4">♡</div>
  <div class="corazon c5">🤎</div>
  <div class="corazon c6">♡</div>
  <div class="corazon c7">🤎</div>

  <!-- Mensaje -->
  <div class="contenedor">
    <span class="oso">🧸</span>

    <h1>Te amo</h1>

    <div class="corazon-central">🤎</div>

    <div class="frase">
      Siempre tú.
    </div>
  </div>

</body>
</html>
